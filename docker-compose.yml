services:
  postgres:
    image: postgres
    restart: always
    command: >
      -c jit_above_cost=0
      -c jit_inline_above_cost=0
      -c jit_optimize_above_cost=0
      -c geqo_effort=10
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - './ray-tracing.sql:/opt/ray-tracing.sql:ro'

  clickhouse:
    image: clickhouse
    restart: always
    volumes:
      - './ray-tracing.sql:/opt/ray-tracing.sql:ro'
    ulimits:
      stack: 8277716992

  umbra:
    image: umbradb/umbra
    restart: always
    ulimits:
      nofile: 1048576
      memlock: 8388608

  psql-client:
    image: postgres
    entrypoint: ["sleep", "infinity"]
    environment:
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - './ray-tracing.sql:/opt/ray-tracing.sql:ro'

